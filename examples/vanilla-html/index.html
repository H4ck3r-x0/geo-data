<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>geo-data — Vanilla HTML Example</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 2rem; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
    .lang-toggle { margin-bottom: 1.5rem; }
    .lang-toggle button {
      padding: 0.5rem 1rem; border: 1px solid #ccc; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 0.9rem;
    }
    .lang-toggle button:hover { background: #e8e8e8; }
    label { display: block; font-weight: 600; margin-bottom: 0.25rem; font-size: 0.9rem; }
    select {
      width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px;
      font-size: 0.95rem; margin-bottom: 1rem; background: #fff;
    }
    .card {
      background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem;
      margin-top: 0.5rem; display: none;
    }
    .card h2 { font-size: 1rem; margin-bottom: 0.5rem; }
    .card p { font-size: 0.85rem; color: #555; margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Geo Data Explorer</h1>

    <div class="lang-toggle">
      <button id="langBtn">العربية</button>
    </div>

    <label id="countryLabel" for="country">Country</label>
    <select id="country"><option value="">—</option></select>

    <label id="regionLabel" for="region">Region</label>
    <select id="region"><option value="">—</option></select>

    <label id="cityLabel" for="city">City</label>
    <select id="city"><option value="">—</option></select>

    <div class="card" id="info">
      <h2 id="infoName"></h2>
      <p id="infoRegion"></p>
      <p id="infoCountry"></p>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
